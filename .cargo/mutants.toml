# cargo-mutants configuration.
#
# Mutation testing measures whether the test suite actually *verifies*
# behaviour, not merely whether lines are executed (which 95% line
# coverage already guarantees). A mutant that survives — the source was
# changed but every test still passed — is a hole the tests do not
# catch, and on a security guardrail that hole maps directly to a real
# bypass.
#
# The full ~31k-line crate is too slow to mutate on every run, so the
# scope is pinned to the security-critical decision core and the trust
# boundaries that feed it (kept in sync with `examine_globs` below):
#   - src/decision.rs     — decision aggregation (deny > ask > monitor > allow)
#   - src/rules/**        — every built-in rule matcher / threshold
#   - src/engine/**       — filter composition, aggregate, mode demotion
#   - src/plugin/dsl.rs   — plugin `when:` DSL compiler / evaluator
#   - src/facts/shell.rs  — shell parser / privilege-wrapper unwrapping
#   - src/config/merge.rs — layered config merge (last-write-wins, union)
#   - src/self_paths.rs   — self-protection path matching (hardDeny basis)
#
# Run via `make mutants`; CI runs the full scope nightly (see
# .github/workflows/nightly.yml). Not part of `make check`.

examine_globs = [
    "src/decision.rs",
    "src/rules/**/*.rs",
    "src/engine/**/*.rs",
    "src/plugin/dsl.rs",
    "src/facts/shell.rs",
    "src/config/merge.rs",
    "src/self_paths.rs",
]

# Loop-index arithmetic mutants in the shell parser can spin until the
# per-mutant test timeout without signalling a real coverage gap.
exclude_re = [
    'replace \+= with \-= in unwrap_prefix_wrapper',
    'replace \+= with \*= in unwrap_prefix_wrapper',
    'replace \+= with \-= in tokenize',
    'replace \+= with \*= in tokenize',
    'replace \+= with [-*]= in (read_word|read_heredoc_body|absorb_parens|plain_run_len)',
    # `plain_run_len` is a fast path: returning 0 only makes the caller
    # take the byte-at-a-time loop (equivalent; see mutants-inventory.md).
    'replace plain_run_len -> usize with 0',
    # A `read_word` that consumes nothing stalls the lexer, and one that
    # returns a fixed substitution body re-parses it forever: both only
    # ever time out.
    'replace read_word -> .* with \(.*, 0, (true|false), .*\)',
    'replace read_word -> .* with .*vec!\["xyzzy"\.into\(\)\]\)',
    # Stepping a lexer index backwards re-reads the same bytes forever.
    'replace \+ with - in (tokenize|read_word|read_heredoc_body|absorb_parens)',
    # `plain_run_len` is a fast path: returning 0 only makes the caller
    # take the byte-at-a-time loop (equivalent; see mutants-inventory.md).
    'replace plain_run_len -> usize with 0',
    # A `read_word` that consumes nothing stalls the lexer, and one that
    # returns a fixed substitution body re-parses it forever: both only
    # ever time out.
    'replace read_word -> .* with \(.*, 0, (true|false), .*\)',
    'replace read_word -> .* with .*vec!\["xyzzy"\.into\(\)\]\)',
    # Stepping a lexer index backwards re-reads the same bytes forever.
    'replace \+ with - in (tokenize|read_word|read_heredoc_body|absorb_parens)',
    # Same for the backquote unescaper: a step that does not advance `i` spins.
    'replace \+= with [-*]= in unescape_backquoted',
    'replace Engine::builder -> EngineBuilder with Default::default\(\)',
    # The quote-aware `$(…)` scanners: an index that steps backwards or not
    # at all (including stubs that return a fixed early index) spins until
    # the per-mutant timeout. `skip_backquoted`'s escape step (column 24) is
    # still mutated and killed by a direct test.
    'replace \+= with -= in (find_group_close|skip_double_quoted|skip_backquoted)',
    'replace \+= with \*= in (find_group_close|skip_double_quoted)',
    ':\d+:20: replace \+= with \*= in skip_backquoted',
    'replace \+ with - in find_group_close',
    'replace skip_(double_quoted|backquoted) -> Option<usize> with Some\([01]\)',
    # Index arithmetic in the ANSI-C (`$'…'`) decoder: stepping backwards
    # or not at all only ever spins until the per-mutant timeout.
    'replace read_ansi_c_quoted -> usize with [01]',
    'replace \+ with - in (read_ansi_c_quoted|decode_ansi_c_escape)',
    'replace \+ with \* in read_ansi_c_quoted',
    'replace \+= with \*= in decode_ansi_c_escape',
    'replace decode_ansi_c_escape -> \(u32, usize\) with .*',
    # Index-stalling mutants: the lexer stops advancing and the run only
    # ever times out instead of failing a test.
    'replace read_word_with_braces -> .* with .*vec!\["xyzzy"\.into\(\)\], vec!\[.*\]\)',
    # `p += 1` stalling, and `start = open + 1` re-entering the same group
    # (exponential fan-out down to the nesting cap): both only time out.
    'replace \+= with [-*]= in expand_range',
    ':\d+:26: replace \+ with [-*] in brace_alternatives',
    # Letting over-long comma-less bodies reach `brace_sequence` brings
    # back the quadratic rescan; the linear-time test then only times out.
    'replace > with (==|<) in brace_alternatives',
    # The alternatives cap only saves work: `brace_product` caps the
    # output again, so one extra alternative is unobservable.
    'replace < with <= in brace_alternatives',
]
