[package]
name = "ptuf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# `libfuzzer-sys` is consumed through the `fuzz_target!` macro; some
# static analysers miss macro-only usage, so it is pinned here as a
# documented false-positive suppression for cargo-machete.
[package.metadata.cargo-machete]
ignored = ["libfuzzer-sys"]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
# Structure-aware generation for `fuzz_engine_structured`: assembles valid
# `HookInput` / `Config` values directly instead of bouncing arbitrary bytes
# off the YAML/JSON parsers. Confined to this isolated fuzz workspace, so the
# shipped library and its public API gain no dependency.
arbitrary = { version = "1", features = ["derive"] }

[dependencies.ptuf]
path = ".."

# This crate is a standalone workspace so the coverage-guided fuzz
# tooling (and its nightly-only `-Z` build flags) never interferes with
# the parent crate's `cargo build` / `cargo clippy --all-targets` /
# cargo-deny / crates.io package contents.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "fuzz_shell_parse"
path = "fuzz_targets/fuzz_shell_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_hook_pipeline"
path = "fuzz_targets/fuzz_hook_pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_config_merge"
path = "fuzz_targets/fuzz_config_merge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_plugin_dsl"
path = "fuzz_targets/fuzz_plugin_dsl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_copilot_parse"
path = "fuzz_targets/fuzz_copilot_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_engine_structured"
path = "fuzz_targets/fuzz_engine_structured.rs"
test = false
doc = false
bench = false
