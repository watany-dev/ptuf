name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt -- --check

  lint:
    name: Clippy + doc warnings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Clippy
        run: cargo clippy --all-targets --locked --features testing -- -D warnings
      - name: Doc warnings
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked

  test:
    # Cross-OS matrix without windows-latest: see plan in
    # /root/.claude/plans/ci-ci-resilient-toast.md Step 4a.
    # Windows path-handling tests are stabilised in a follow-up PR
    # before re-enabling the windows-latest cell.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@ec28e287910af896fd98e04056d31fa68607e7ad # v2.77.4
        with:
          tool: cargo-nextest@0.9.133
      - name: Test (PR-tier PBT, PROPTEST_CASES=1024)
        env:
          PROPTEST_CASES: 1024
        run: cargo nextest run --locked --all-targets --features testing
      - name: Doctests
        run: cargo test --locked --doc

  pbt-deep:
    # Deep PBT run gated to main pushes so PR latency stays bounded.
    # Mirrors `make pbt` (10000 cases / property). The `make pbt-deep`
    # tier (100000) is intentionally not on CI — it is reserved for
    # local soak / pre-release validation.
    name: PBT deep (10k cases)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@ec28e287910af896fd98e04056d31fa68607e7ad # v2.77.4
        with:
          tool: cargo-nextest@0.9.133
      - name: PBT deep
        env:
          PROPTEST_CASES: 10000
        run: cargo nextest run --locked --all-targets --features testing

  coverage:
    name: Coverage (tarpaulin)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@ec28e287910af896fd98e04056d31fa68607e7ad # v2.77.4
        with:
          tool: cargo-tarpaulin@0.35.1
      - name: Coverage
        run: |
          cargo tarpaulin --out json --out html \
            --locked \
            --features testing \
            --skip-clean \
            --features testing \
            --fail-under 95 \
            --exclude-files "src/main.rs" \
            --exclude-files "src/**/windows*.rs" \
            --exclude-files "src/**/*_windows.rs" \
            --timeout 300 \
            -- --test-threads=1
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            tarpaulin-report.json
            tarpaulin-report.html
          if-no-files-found: ignore
          retention-days: 14

  msrv:
    # Real MSRV verification — not a dry-run. We invoke `cargo build`
    # (not `cargo check`) on the locked dependency graph plus
    # `cargo test --no-run` so the test harness must also compile under
    # the pinned MSRV. Bumping `package.rust-version` requires the CI
    # toolchain `dtolnay/rust-toolchain@<msrv>` pin below to move in
    # the same PR, plus a CHANGELOG entry per SECURITY.md policy.
    name: MSRV build (1.93.0)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.93.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: MSRV build (release profile, locked)
        run: cargo build --release --all-targets --locked --features testing
      - name: MSRV test compile (harness must build, but do not run)
        run: cargo test --no-run --all-targets --locked --features testing
      - name: MSRV doc build (lints kept as warnings — strict deny lives in `lint` job)
        run: cargo doc --no-deps --locked --features testing

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install actionlint
        run: bash <(curl -sL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.11
      - name: Run actionlint
        run: ./actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload SARIF to Code Scanning
      actions: read           # codeql-action queries the workflow run API
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
        with:
          inputs: ./.github/workflows/
          persona: auditor
          version: 1.24.1

  security:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@91bf2b620e09e18d6eb78b92e7861937469acedb # v2.0.17

  machete:
    name: cargo-machete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: taiki-e/install-action@ec28e287910af896fd98e04056d31fa68607e7ad # v2.77.4
        with:
          tool: cargo-machete@0.9.2
      - name: Detect unused dependencies
        run: cargo machete
