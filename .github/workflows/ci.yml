name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger so CI can be (re)run on a branch without a new
  # webhook-delivered event, e.g. from automation whose pushes do not
  # create workflow runs.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt -- --check

  lint:
    name: Clippy + doc warnings
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Clippy
        run: cargo clippy --all-targets --locked --features testing -- -D warnings
      - name: Doc warnings
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked

  test:
    # Cross-OS matrix without windows-latest: see plan in
    # /root/.claude/plans/ci-ci-resilient-toast.md Step 4a.
    # Windows path-handling tests are stabilised in a follow-up PR
    # before re-enabling the windows-latest cell.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-nextest@0.9.133
      # On macos-14 hosted images something between rust-cache and
      # install-action replaces $CARGO_HOME/bin/cargo with the bare
      # rustup-init binary, so `cargo nextest run` reports
      # `Usage: rustup-init[EXE]` and dies. Re-assert the multiplexer
      # shim by symlinking cargo/rustc/rustdoc back to the rustup binary
      # right before the test step. Idempotent on Linux.
      - name: Diagnose and repair cargo shim
        shell: bash
        run: |
          set -x
          echo "PATH=$PATH"
          which -a cargo || true
          ls -la "$CARGO_HOME/bin" || true
          file "$CARGO_HOME/bin/cargo" 2>/dev/null || true
          if ! cargo --version >/dev/null 2>&1; then
            echo "::warning::cargo shim broken after install-action; repairing"
            rustup_bin=$(command -v rustup)
            for shim in cargo rustc rustdoc; do
              ln -sf "$rustup_bin" "$CARGO_HOME/bin/$shim"
            done
          fi
          cargo --version
          rustc --version
      - name: Test (PR-tier PBT, PROPTEST_CASES=1024)
        env:
          PROPTEST_CASES: 1024
        run: cargo nextest run --locked --all-targets --features testing
      - name: Doctests
        run: cargo test --locked --doc

  pbt-deep:
    # Deep PBT run gated to main pushes so PR latency stays bounded.
    # Mirrors `make pbt` (10000 cases / property). The `make pbt-deep`
    # tier (100000) is intentionally not on CI — it is reserved for
    # local soak / pre-release validation.
    name: PBT deep (10k cases)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-nextest@0.9.133
      - name: PBT deep
        env:
          PROPTEST_CASES: 10000
        run: cargo nextest run --locked --all-targets --features testing

  coverage:
    name: Coverage (tarpaulin)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-tarpaulin@0.35.1
      - name: Coverage
        run: |
          cargo tarpaulin --out json --out html \
            --locked \
            --features testing \
            --skip-clean \
            --features testing \
            --fail-under 95 \
            --exclude-files "src/main.rs" \
            --exclude-files "src/**/windows*.rs" \
            --exclude-files "src/**/*_windows.rs" \
            --exclude-files "src/testing/**" \
            --exclude-files "benches/**" \
            --timeout 300 \
            -- --test-threads=1
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            tarpaulin-report.json
            tarpaulin-report.html
          if-no-files-found: ignore
          retention-days: 14

  msrv:
    # Real MSRV verification — not a dry-run. `cargo build` (not `cargo check`)
    # exercises codegen and linking; `cargo test --no-run` ensures the test
    # harness compiles under the pinned MSRV. Bumping `package.rust-version`
    # requires the `dtolnay/rust-toolchain@…` pin below to move in the same
    # PR, plus a CHANGELOG entry per SECURITY.md policy.
    name: MSRV build (1.93.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.93.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: MSRV build (release profile, locked)
        run: cargo build --release --all-targets --locked --features testing
      - name: MSRV test compile (harness must build, but do not run)
        run: cargo test --no-run --all-targets --locked --features testing
      - name: MSRV doc build (lints kept as warnings — strict deny lives in `lint` job)
        run: cargo doc --no-deps --locked --features testing

  npm-smoke:
    name: npm smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build release binary
        run: cargo build --release --locked
      - name: Pack and smoke-test npm packages
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          install -D -m 0755 target/release/ptuf npm/platform/cli-linux-x64-gnu/bin/ptuf
          node npm/scripts/stamp.mjs --version "v${version}"
          node npm/scripts/smoke.mjs

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: bash <(curl -sL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.11
      - name: Run actionlint
        run: ./actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write  # upload SARIF to Code Scanning
      actions: read           # codeql-action queries the workflow run API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          inputs: ./.github/workflows/
          persona: auditor
          version: 1.24.1

  security:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  machete:
    name: cargo-machete
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-machete@0.9.2
      - name: Detect unused dependencies
        run: cargo machete

  semver:
    name: SemVer check
    # Public-API SemVer gate: fails the PR when an exported item in
    # `src/lib.rs` (`decide`, `try_decide`, `Engine`, `Decision`, …)
    # changes incompatibly without a version bump. Compares the PR tree
    # against `origin/main`; once the crate is published the crates.io
    # release becomes the automatic baseline.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so `--baseline-rev origin/main` resolves.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-semver-checks@0.47.0
      - name: SemVer check
        run: cargo semver-checks --baseline-rev origin/main
