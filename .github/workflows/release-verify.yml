# Release Verify
#
# A sibling of `release.yml` (cargo-dist) and `publish-crates.yml`.
# After cargo-dist publishes a GitHub Release, this workflow:
#
#   1. Downloads the archives + per-archive `.sha256` files.
#   2. Aggregates them into a single `SHA256SUMS` file.
#   3. Generates a Syft / SPDX 2.3 JSON SBOM (`ptuf-<tag>.spdx.json`)
#      from `Cargo.lock` and appends its SHA-256 to `SHA256SUMS`.
#   4. Issues a GitHub Build Provenance Attestation covering the
#      archives + `SHA256SUMS`.
#   5. Issues an SBOM Attestation linking the SBOM to each archive.
#   6. Uploads `SHA256SUMS` and the SBOM back to the GitHub Release.
#
# Verification UX (see README "Verified install"):
#   sha256sum --ignore-missing -c SHA256SUMS
#   gh attestation verify <archive> --owner watany-dev
#
# This workflow is hand-written and is NOT regenerated by `dist generate`.
# It is in scope for zizmor's full audit (see `.github/zizmor.yml`).

name: Release Verify

on:
  release:
    types: [published]

# Per-ref serialization. Matches release.yml / publish-crates.yml policy:
# do not cancel-in-progress so partial uploads are not abandoned.
concurrency:
  group: release-verify-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write       # gh release upload (SHA256SUMS, SBOM)
      attestations: write   # actions/attest-build-provenance, actions/attest-sbom
      id-token: write       # OIDC for Sigstore signing
    env:
      # github.event.* is funneled through env to avoid template injection
      # in `run:` blocks (release.yml IS_PR / REF_NAME pattern).
      TAG: ${{ github.event.release.tag_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Download release archives and per-archive checksums
        # Installer scripts (.sh / .ps1) are intentionally excluded:
        # they are covered by build-provenance attestation but are not
        # part of SHA256SUMS (see ADR 0001).
        run: |
          mkdir -p artifacts
          gh release download "$TAG" \
            --repo "$REPO" \
            --dir artifacts \
            --pattern 'ptuf-*.tar.gz' \
            --pattern 'ptuf-*.zip' \
            --pattern 'ptuf-*.tar.gz.sha256' \
            --pattern 'ptuf-*.zip.sha256'
          ls -la artifacts/

      - name: Aggregate per-archive checksums into SHA256SUMS
        working-directory: artifacts
        run: |
          # cargo-dist emits per-archive .sha256 files in the
          # `<sha256>  <basename>` format expected by `sha256sum -c`.
          cat ./*.sha256 | sort > SHA256SUMS
          rm -f ./*.sha256
          cat SHA256SUMS

      - name: Generate SBOM (Syft, SPDX 2.3 JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./Cargo.lock
          format: spdx-json
          output-file: artifacts/ptuf-${{ env.TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Append SBOM checksum to SHA256SUMS
        working-directory: artifacts
        run: |
          # cargo-dist did not emit a .sha256 for the SBOM; compute it here.
          sha256sum "ptuf-${TAG}.spdx.json" >> SHA256SUMS
          sort -o SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Build provenance attestation (archives + SHA256SUMS)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            artifacts/ptuf-*.tar.gz
            artifacts/ptuf-*.zip
            artifacts/SHA256SUMS

      - name: SBOM attestation (link SBOM to each archive)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            artifacts/ptuf-*.tar.gz
            artifacts/ptuf-*.zip
          sbom-path: artifacts/ptuf-${{ env.TAG }}.spdx.json

      - name: Upload SHA256SUMS and SBOM to release
        run: |
          # --clobber keeps the upload idempotent across re-runs (RC retries
          # or post-failure restarts), so a stale SHA256SUMS / SBOM never
          # blocks a successful re-verification.
          gh release upload "$TAG" \
            --repo "$REPO" \
            --clobber \
            "artifacts/SHA256SUMS" \
            "artifacts/ptuf-${TAG}.spdx.json"
