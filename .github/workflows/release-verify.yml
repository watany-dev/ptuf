# Hand-written sibling of release.yml (cargo-dist) and publish-crates.yml.
# NOT regenerated by `dist generate`. In scope for zizmor's full audit
# (no entries in .github/zizmor.yml `ignore:` lists).

name: Release Verify

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      # Funnel github.event.* through env to avoid template injection in
      # `run:` blocks (release.yml IS_PR / REF_NAME pattern).
      TAG: ${{ github.event.release.tag_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARTIFACTS_DIR: artifacts
    steps:
      - name: Checkout Cargo.lock at tag commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
          sparse-checkout: Cargo.lock
          sparse-checkout-cone-mode: false

      - name: Download release archives and per-archive checksums
        # Installer scripts (.sh / .ps1) are excluded from SHA256SUMS by design
        # (ADR 0001 D5); they remain covered by build-provenance attestation.
        run: |
          mkdir -p "$ARTIFACTS_DIR"
          gh release download "$TAG" \
            --repo "$REPO" \
            --dir "$ARTIFACTS_DIR" \
            --pattern 'ptuf-*.tar.gz' \
            --pattern 'ptuf-*.zip' \
            --pattern 'ptuf-*.tar.gz.sha256' \
            --pattern 'ptuf-*.zip.sha256'
          ls -la "$ARTIFACTS_DIR"/

      - name: Aggregate per-archive checksums into SHA256SUMS
        working-directory: ${{ env.ARTIFACTS_DIR }}
        run: |
          cat ./*.sha256 | sort > SHA256SUMS
          rm -f ./*.sha256

      - name: Generate SBOM (Syft, SPDX 2.3 JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./Cargo.lock
          format: spdx-json
          output-file: ${{ env.ARTIFACTS_DIR }}/ptuf-${{ env.TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Append SBOM checksum to SHA256SUMS
        working-directory: ${{ env.ARTIFACTS_DIR }}
        run: |
          sha256sum "ptuf-${TAG}.spdx.json" >> SHA256SUMS
          sort -o SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Build provenance attestation (archives + SHA256SUMS)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            ${{ env.ARTIFACTS_DIR }}/ptuf-*.tar.gz
            ${{ env.ARTIFACTS_DIR }}/ptuf-*.zip
            ${{ env.ARTIFACTS_DIR }}/SHA256SUMS

      - name: SBOM attestation (link SBOM to each archive)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            ${{ env.ARTIFACTS_DIR }}/ptuf-*.tar.gz
            ${{ env.ARTIFACTS_DIR }}/ptuf-*.zip
          sbom-path: ${{ env.ARTIFACTS_DIR }}/ptuf-${{ env.TAG }}.spdx.json

      - name: Upload SHA256SUMS and SBOM to release
        # --clobber keeps the upload idempotent across re-runs.
        run: |
          gh release upload "$TAG" \
            --repo "$REPO" \
            --clobber \
            "${ARTIFACTS_DIR}/SHA256SUMS" \
            "${ARTIFACTS_DIR}/ptuf-${TAG}.spdx.json"
