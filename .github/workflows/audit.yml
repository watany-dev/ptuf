name: Security audit

on:
  schedule:
    # Every day at 06:00 UTC. The ci.yml cargo-deny job runs only on PR/push,
    # so this catches newly-published RustSec advisories on quiet weeks.
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/audit.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same action and pin as the `security` job in ci.yml, so the
      # advisory ignore list lives only in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
