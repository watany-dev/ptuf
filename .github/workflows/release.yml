#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.
#
# IMPORTANT — DO NOT REGENERATE BLINDLY.
# This workflow is the cargo-dist 0.31.0 generated output with multiple
# hand-patches that MUST be re-applied after `dist generate`:
#   - workflow-level `permissions: contents: read` (minimal), plus
#     per-job `permissions:` blocks (zizmor-recommended)
#   - top-level `concurrency:` serialised per ref with
#     cancel-in-progress: false (do not abandon partial uploads)
#   - the `plan` step uses env (IS_PR / REF_NAME) instead of inline
#     `${{ }}` to keep github.ref_name out of shell template expansion
#   - third-party actions are SHA-pinned in this file
#   - host job publishes canonical verified-install archives, SPDX JSON SBOM,
#     SHA256SUMS, and separate GitHub provenance/SBOM attestations
#   - publish-crates-io job appended after `announce` for crates.io publish
#     (requires `CRATES_IO_TOKEN` secret with publish-new + publish-update scopes)
#   - publish-npm job appended after `announce` for npm publish
#     (uses npm Trusted Publishing / GitHub OIDC, no long-lived token)
#   - publish-homebrew-formula job inserted between `host` and `announce`
#     (cargo-dist 0.31.0 native, pushes formula to watany-dev/homebrew-tap;
#     requires `HOMEBREW_TAP_TOKEN` secret; SHA-pinned to match other jobs)
# See CONTRIBUTING.md "Regenerating release.yml" for the runbook.

name: Release
# Workflow-level permissions are minimized. Only the `host` job, which calls
# `gh release create`, requests `contents: write`. Other jobs run with
# `contents: read`.
permissions:
  contents: read

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

# Serialize releases per ref. We deliberately do NOT cancel-in-progress so a
# re-trigger does not abandon partially-uploaded artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        # github.ref_name is exposed via env to keep it out of shell template
        # expansion. The is_pr branch decides between `dist plan` and
        # `dist host --steps=create --tag=...` without interpolation.
        env:
          IS_PR: ${{ github.event.pull_request != null }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$IS_PR" = "true" ]; then
            dist plan --output-format=json > plan-dist-manifest.json
          else
            dist host --steps=create --tag="$REF_NAME" --output-format=json > plan-dist-manifest.json
          fi
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    permissions:
      contents: read
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: write  # required by `gh release create` in the Create GitHub Release step
      id-token: write  # required by `actions/attest`
      attestations: write  # required by `actions/attest`
      artifact-metadata: write  # required by `actions/attest` storage records
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create canonical archives
        shell: bash
        run: |
          set -euo pipefail

          find_one_artifact() {
            local source_pattern="$1"
            local matches=()

            shopt -s nullglob
            # shellcheck disable=SC2206 # intentional glob expansion of source_pattern
            matches=(artifacts/$source_pattern)
            shopt -u nullglob

            # cargo-dist 0.31.0 emits per-archive sidecars (.sha256, signatures,
            # SBOM JSON) under the same prefix. The `.tar.*` glob picks them up
            # along with the real archive, so drop known sidecar extensions.
            local filtered=()
            local m
            for m in "${matches[@]}"; do
              case "$m" in
                *.sha256|*.sig|*.asc|*.minisig|*.spdx.json) continue ;;
                *) filtered+=("$m") ;;
              esac
            done
            matches=("${filtered[@]}")

            if [ "${#matches[@]}" -ne 1 ]; then
              printf 'expected exactly one artifact matching %s, found %s\n' "$source_pattern" "${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi

            printf '%s\n' "${matches[0]}"
          }

          canonical_tar_gz() {
            local source
            local dest="$2"
            local tmpdir
            source="$(find_one_artifact "$1")"

            case "$source" in
              *.tar.gz)
                # cargo-dist 0.31.0 already emits canonical names, so the
                # source path may equal "artifacts/$dest". cp would fail with
                # "same file" in that case; skip the copy when there is
                # nothing to rename.
                if [ "$source" != "artifacts/$dest" ]; then
                  cp "$source" "artifacts/$dest"
                fi
                ;;
              *.tar.xz)
                tmpdir="$(mktemp -d)"
                tar -xJf "$source" -C "$tmpdir"
                mapfile -t entries < <(find "$tmpdir" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
                if [ "${#entries[@]}" -eq 1 ]; then
                  tar -C "$tmpdir" -czf "artifacts/$dest" "${entries[0]}"
                else
                  tar -C "$tmpdir" -czf "artifacts/$dest" .
                fi
                rm -rf "$tmpdir"
                ;;
              *)
                printf 'unsupported Unix archive format: %s\n' "$source" >&2
                exit 1
                ;;
            esac
          }

          copy_zip_if_different() {
            local src="$1"
            local dest="artifacts/$2"
            if [ "$src" != "$dest" ]; then
              cp "$src" "$dest"
            fi
          }

          canonical_tar_gz 'ptuf-*aarch64-apple-darwin.tar.*' 'ptuf-aarch64-apple-darwin.tar.gz'
          canonical_tar_gz 'ptuf-*aarch64-unknown-linux-gnu.tar.*' 'ptuf-aarch64-unknown-linux-gnu.tar.gz'
          canonical_tar_gz 'ptuf-*aarch64-unknown-linux-musl.tar.*' 'ptuf-aarch64-unknown-linux-musl.tar.gz'
          canonical_tar_gz 'ptuf-*x86_64-apple-darwin.tar.*' 'ptuf-x86_64-apple-darwin.tar.gz'
          canonical_tar_gz 'ptuf-*x86_64-unknown-linux-gnu.tar.*' 'ptuf-x86_64-unknown-linux-gnu.tar.gz'
          canonical_tar_gz 'ptuf-*x86_64-unknown-linux-musl.tar.*' 'ptuf-x86_64-unknown-linux-musl.tar.gz'
          copy_zip_if_different "$(find_one_artifact 'ptuf-*x86_64-pc-windows-msvc.zip')" 'ptuf-x86_64-pc-windows-msvc.zip'
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/ptuf-${{ needs.plan.outputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate SHA256SUMS
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum \
            ptuf-aarch64-apple-darwin.tar.gz \
            ptuf-aarch64-unknown-linux-gnu.tar.gz \
            ptuf-aarch64-unknown-linux-musl.tar.gz \
            ptuf-x86_64-apple-darwin.tar.gz \
            ptuf-x86_64-unknown-linux-gnu.tar.gz \
            ptuf-x86_64-unknown-linux-musl.tar.gz \
            ptuf-x86_64-pc-windows-msvc.zip \
            ptuf-installer.sh \
            ptuf-installer.ps1 \
            "ptuf-${TAG}.spdx.json" > SHA256SUMS
      - name: Attest release provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: artifacts/SHA256SUMS
      - name: Attest release SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: artifacts/SHA256SUMS
          sbom-path: artifacts/ptuf-${{ needs.plan.outputs.tag }}.spdx.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          TAG: "${{ needs.plan.outputs.tag }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"

          gh release create "$TAG" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  # Publish the cargo-dist-generated Homebrew formula to the external tap repo.
  # `HOMEBREW_TAP_TOKEN` (fine-grained PAT with Contents: read/write on the tap
  # repo) must be configured. SHA-pinned third-party actions match the rest of
  # this workflow. `persist-credentials: true` is intentional: the job pushes
  # back to the tap repo using the supplied token.
  publish-homebrew-formula:
    needs:
      - plan
      - host
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ needs.plan.outputs.val }}
      GITHUB_USER: "axo bot"
      GITHUB_EMAIL: "admin+bot@axo.dev"
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          repository: "watany-dev/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # So we have access to the formula
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      # This is extra complex because you can make your Formula name not match your app name
      # so we need to find releases with a *.rb file, and publish with that filename.
      - name: Commit formula files
        run: |
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name="${filename%.rb}"
            version=$(echo "$release" | jq .app_version --raw-output)

            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            brew update
            # We avoid reformatting user-provided data such as the app description and homepage.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done
          git push

  announce:
    needs:
      - plan
      - host
      - publish-homebrew-formula
      - publish-npm
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && (needs.publish-homebrew-formula.result == 'skipped' || needs.publish-homebrew-formula.result == 'success') && (needs.publish-npm.result == 'skipped' || needs.publish-npm.result == 'success') }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

  # Publish the released version to crates.io. Runs only after the GitHub
  # Release (`host`) succeeds on a tag push, so the canonical installer
  # archives are already public before `cargo install` / `cargo binstall`
  # become resolvable.
  publish-crates-io:
    needs:
      - plan
      - host
    if: ${{ always() && needs.host.result == 'success' && needs.plan.outputs.publishing == 'true' }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="ptuf") | .version')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "tag $TAG (=> $TAG_VERSION) does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi
      - name: Install lld (matches release build profile)
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
      - name: cargo publish
        run: cargo publish --locked

  # Publish npm packages after the GitHub Release is public. The npm registry
  # receives repacked, already-attested cargo-dist archives: every archive is
  # checked against SHA256SUMS and verified with GitHub artifact attestations
  # before `npm publish`.
  publish-npm:
    needs:
      - plan
      - host
    if: ${{ always() && needs.host.result == 'success' && needs.plan.outputs.publishing == 'true' && !fromJson(needs.plan.outputs.val).announcement_is_prerelease }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Download release assets
        run: |
          mkdir -p artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts
      - name: Verify release assets
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -c SHA256SUMS
          for archive in ptuf-*.tar.gz ptuf-*.zip; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --source-ref "refs/tags/$TAG"
          done
      - name: Stamp npm packages
        run: node npm/scripts/stamp.mjs --version "$TAG" --artifacts artifacts
      - name: Publish npm packages
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            npm/platform/cli-darwin-arm64
            npm/platform/cli-darwin-x64
            npm/platform/cli-linux-arm64-gnu
            npm/platform/cli-linux-arm64-musl
            npm/platform/cli-linux-x64-gnu
            npm/platform/cli-linux-x64-musl
            npm/platform/cli-win32-x64
            npm/ptuf
          )
          for package_dir in "${packages[@]}"; do
            name="$(node -p "require('./${package_dir}/package.json').name")"
            version="$(node -p "require('./${package_dir}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already published; skipping"
            else
              npm publish "$package_dir" --provenance --access public
            fi
          done
