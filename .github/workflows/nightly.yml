name: Nightly

# Heavy QA that is too slow for the PR gate: coverage-guided fuzzing of
# `fuzz/fuzz_targets/` and full-scope mutation testing of the
# decision core. Mirrors the `make fuzz` / `make mutants` local targets.
# Runs on a schedule and on demand; never blocks a PR. A failed run on
# main files (or comments on) one tracking issue (`nightly-issue`), since
# GitHub's scheduled-workflow e-mail alone is easy to miss.
on:
  schedule:
    # 03:00 UTC daily.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_shell_parse
          - fuzz_hook_pipeline
          - fuzz_config_merge
          - fuzz_plugin_dsl
          - fuzz_copilot_parse
          - fuzz_opencode_parse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-fuzz requires a nightly toolchain for its sanitizer build
      # flags; pin the same trusted action SHA used elsewhere and select
      # the channel explicitly.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz@0.13.1
      # cargo-binstall ships musl binaries; ASAN fuzz builds need the gnu
      # target so sanitizer flags are not paired with static libc.
      - name: Install gnu target for sanitizer fuzz builds
        run: rustup target add x86_64-unknown-linux-gnu
      - name: Fuzz ${{ matrix.target }}
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=300 -timeout=10
      # A crash leaves a reproducer under fuzz/artifacts/<target>/; keep
      # it so the failure can be triaged and added to the regression set.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  mutants:
    name: cargo-mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Builds dominate the wall clock; drop debuginfo to shrink the
      # per-job build dirs and speed up linking (see `make mutants`).
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-mutants@27.0.0
      # Scope (decision core + shell / DSL / merge / self_paths) comes from
      # .cargo/mutants.toml.
      - name: Mutation testing
        run: cargo mutants --no-shuffle -j 2
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-report
          path: mutants.out/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: heavy E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run heavy E2E suite
        run: make e2e

  # Formal models (formal/README.md): TLC over formal/tla and the Kani
  # harnesses in src/. Ubuntu runners ship Java 17 for TLC.
  formal:
    name: formal models (TLA+ / Kani)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: TLA+ (TLC)
        run: make tla
      - name: Kani
        run: make kani

  # A failed run on main files its result as an issue: the scheduled-workflow
  # e-mail alone lets a red nightly sit unnoticed. One open issue collects
  # every failed run, each as a comment. A cancelled run files nothing.
  nightly-issue:
    name: Nightly (file failure on main)
    needs: [fuzz, mutants, e2e, formal]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # gh issue create / comment
    steps:
      # A job whose runner was lost uploads nothing; file the issue anyway.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: mutants-report
          path: mutants-report
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "ci: nightly QA failed on main"
          FUZZ: ${{ needs.fuzz.result }}
          MUTANTS: ${{ needs.mutants.result }}
          E2E: ${{ needs.e2e.result }}
          FORMAL: ${{ needs.formal.result }}
        run: |
          missed=$(sort -u mutants-report/missed.txt 2>/dev/null || true)
          {
            echo "The [nightly run]($RUN_URL) failed on \`${GITHUB_SHA::7}\`."
            echo
            echo "| job | result |"
            echo "|---|---|"
            echo "| fuzz | $FUZZ |"
            echo "| cargo-mutants | $MUTANTS |"
            echo "| heavy E2E | $E2E |"
            echo "| formal models | $FORMAL |"
            echo
            if [ "$FUZZ" = failure ]; then
              echo "fuzz: download the \`fuzz-artifacts-*\` artifacts, add the reproducer to \`fuzz/artifacts/\` and the bypass to \`tests/bypass/corpus.jsonl\`."
              echo
            fi
            if [ -n "$missed" ]; then
              echo "Missed mutants: add the test, or exclude an equivalent mutant in \`.cargo/mutants.toml\`. Classify them in \`docs/design/mutants-inventory.md\`."
              echo
              echo '```'
              echo "$missed"
              echo '```'
            fi
          } > body.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          fi
