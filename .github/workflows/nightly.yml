name: Nightly

# Heavy QA that is too slow for the PR gate: coverage-guided fuzzing of
# the four trust boundaries and full-scope mutation testing of the
# decision core. Mirrors the `make fuzz` / `make mutants` local targets.
# Runs on a schedule and on demand; never blocks a PR.
on:
  schedule:
    # 03:00 UTC daily.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_shell_parse
          - fuzz_hook_pipeline
          - fuzz_config_merge
          - fuzz_plugin_dsl
          - fuzz_copilot_parse
          - fuzz_opencode_parse
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # cargo-fuzz requires a nightly toolchain for its sanitizer build
      # flags; pin the same trusted action SHA used elsewhere and select
      # the channel explicitly.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-fuzz@0.13.1
      # cargo-binstall ships musl binaries; ASAN fuzz builds need the gnu
      # target so sanitizer flags are not paired with static libc.
      - name: Install gnu target for sanitizer fuzz builds
        run: rustup target add x86_64-unknown-linux-gnu
      - name: Fuzz ${{ matrix.target }}
        env:
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -timeout=10
      # A crash leaves a reproducer under fuzz/artifacts/<target>/; keep
      # it so the failure can be triaged and added to the regression set.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  mutants:
    name: cargo-mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-mutants@27.0.0
      # Scope (decision.rs / rules / engine) comes from .cargo/mutants.toml.
      - name: Mutation testing
        run: cargo mutants --no-shuffle
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-report
          path: mutants.out/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: heavy E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run heavy E2E suite
        run: make e2e
