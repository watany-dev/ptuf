[graph]
targets = []
all-features = true

[advisories]
# RUSTSEC-2024-0449: `unsafe-libyaml` is unmaintained (upstream repo archived).
# It is pulled in transitively via `serde_yaml_ng`, our YAML parser for plugin /
# config files. This is an "unmaintained" advisory, not a known vulnerability,
# and no maintained drop-in replacement is wired in yet. Keep this list in sync
# with `.cargo/audit.toml`.
ignore = ["RUSTSEC-2024-0449"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Artistic-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
