cognitive-complexity-threshold = 10
too-many-lines-threshold = 80
too-many-arguments-threshold = 5
max-struct-bools = 3

# Lift unwrap/expect/panic/print/dbg lints inside `#[cfg(test)]` modules
# and `tests/` integration tests so production deny-level rules stay strict
# without forcing escape-hatch attrs on every test file. Requires clippy >=1.71.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
