# rustfmt configuration for ptuf.
#
# Stable-channel options only. The CI fmt job runs on stable
# (`.github/workflows/ci.yml` `fmt` step), so any nightly-only option
# here would silently skip or fail `cargo fmt -- --check`. Avoid
# `group_imports`, `imports_granularity`, `wrap_comments`,
# `format_code_in_doc_comments`, `comment_width`, `normalize_comments`,
# `condense_wildcard_suffixes`, `format_strings`, `unstable_features`.

edition = "2024"
max_width = 100
tab_spaces = 4
hard_tabs = false
newline_style = "Unix"

use_field_init_shorthand = true
use_try_shorthand = true
force_explicit_abi = true
match_block_trailing_comma = true
remove_nested_parens = true
reorder_imports = true
reorder_modules = true
